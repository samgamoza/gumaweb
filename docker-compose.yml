# GumaWeb local stack.   docker compose up --build
# Host ports are configurable (.env) so the stack can run next to other projects:
#   Portal  http://localhost:${GW_PORTAL_PORT:-3000}     API docs  http://localhost:${GW_API_PORT:-8000}/docs
#   Sites   http://localhost:${GW_SITES_PORT:-8080}/<subdomain>/   Mailpit http://localhost:${GW_MAILPIT_PORT:-8025}
name: gumaweb

x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gumaweb}:${POSTGRES_PASSWORD:-gumaweb}@postgres:5432/${POSTGRES_DB:-gumaweb}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  CORS_ORIGINS: http://localhost:${GW_PORTAL_PORT:-3000}
  FRONTEND_URL: http://localhost:${GW_PORTAL_PORT:-3000}
  API_PUBLIC_URL: http://localhost:${GW_API_PORT:-8000}
  SITE_URL_TEMPLATE: http://localhost:${GW_SITES_PORT:-8080}/{subdomain}/
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@gumaweb.io}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-ChangeMe!2026}
  # AI content (Phase 2). `docker compose --profile ai up` starts Ollama; set AI_ENABLED=true in .env.
  AI_ENABLED: ${AI_ENABLED:-false}
  LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://ollama:11434/v1}
  LLM_PRIMARY_MODEL: ${COMPOSE_LLM_PRIMARY_MODEL:-qwen2.5:1.5b}
  LLM_SECONDARY_MODEL: ${COMPOSE_LLM_SECONDARY_MODEL:-qwen2.5:1.5b}
  AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-true}
  IMAGE_BACKEND: ${IMAGE_BACKEND:-procedural}
  LOG_JSON: "false"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gumaweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gumaweb}
      POSTGRES_DB: ${POSTGRES_DB:-gumaweb}
    ports: ["${GW_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gumaweb}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${GW_REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${GW_MAILPIT_PORT:-8025}:8025", "${GW_SMTP_PORT:-1025}:1025"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["s3"]  # docker compose --profile s3 up   (then STORAGE_BACKEND=s3)
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gumaweb}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gumaweb-secret}
    ports: ["${GW_MINIO_PORT:-9000}:9000", "${GW_MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [miniodata:/data]

  # Named volumes are initialized root-owned by whichever container mounts them first;
  # hand the published-sites volume to the API's non-root user (UID 10001).
  init-volumes:
    image: alpine:3.20
    command: ["sh", "-c", "rm -f /srv/generated-sites/index.html /srv/generated-sites/50x.html && chown -R 10001:10001 /srv/generated-sites"]
    volumes:
      - sites:/srv/generated-sites

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: gumaweb/api:dev
    environment: *api-env
    # Migrate, seed plans/templates/admin + fictional demo businesses, then run one factory batch.
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed --demo && python -m app.cli generate --limit 20 --publish"]
    volumes:
      - sites:/srv/generated-sites
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      init-volumes: { condition: service_completed_successfully }

  api:
    image: gumaweb/api:dev
    environment: *api-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["${GW_API_PORT:-8000}:8000"]
    volumes:
      - ./backend/app:/app/app
      - ./templates:/srv/templates
      - sites:/srv/generated-sites
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Factory worker: drains the job queue (generate/regenerate/publish) and relays domain events to Redis.
  worker:
    image: gumaweb/api:dev
    environment: *api-env
    command: ["python", "-m", "app.cli", "worker"]
    healthcheck: { disable: true }  # the image's check probes HTTP :8000; the worker serves none
    volumes:
      - ./backend/app:/app/app
      - ./templates:/srv/templates
      - sites:/srv/generated-sites
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Local LLM server (OpenAI-compatible API). Production runs vLLM on GPU nodes (guma-ai namespace).
  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["ai"]
    ports: ["${GW_OLLAMA_PORT:-11434}:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30

  ollama-pull:
    image: ollama/ollama:0.11.10
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${COMPOSE_LLM_PRIMARY_MODEL:-qwen2.5:1.5b} && ollama pull ${COMPOSE_LLM_SECONDARY_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama: { condition: service_healthy }

  portal:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${GW_API_PORT:-8000}
    ports: ["${GW_PORTAL_PORT:-3000}:3000"]
    depends_on: [api]

  sites:
    image: nginx:1.27-alpine
    ports: ["${GW_SITES_PORT:-8080}:8080"]
    volumes:
      - ./infrastructure/nginx/sites.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - sites:/usr/share/nginx/html:ro

volumes:
  pgdata:
  redisdata:
  miniodata:
  ollama:
  sites:
