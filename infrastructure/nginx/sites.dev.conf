# Local static host for generated sites: http://localhost:8080/<subdomain>/
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Immutable build history is never public.
    location ^~ /_releases/ { return 404; }
    location ^~ /_assets/ { return 404; }   # assets ship inside each site build
    location ^~ /_d/ { return 404; }        # custom-domain copies are served by Host below
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# Custom domains (Phase 5): <domain> and www.<domain> -> /srv/sites/_d/<domain>/ (published for verified
# domains only). Must stay after the *.gumaweb.io server: regex server names match in order.
# Try it locally: curl -H 'Host: yourdomain.ph' http://localhost:${GW_SITES_PORT}/
server {
    listen 8080;
    server_name "~^(?:www\.)?(?<cdomain>(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9-]{2,63})$";
    root /usr/share/nginx/html/_d/$cdomain;

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
