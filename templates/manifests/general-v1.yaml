slug: general-v1
name: General Business - Modern
category: general
version: 1
default: true
industries: [general]
description: Versatile fallback layout for any local business.
theme:
  palette:
    primary: "#1d4ed8"
    primary_contrast: "#ffffff"
    accent: "#0f172a"
    background: "#ffffff"
    surface: "#f5f7fa"
    text: "#0f172a"
    muted: "#4b5563"
    border: "#e5e7eb"
  fonts:
    heading: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
    body: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  radius: 10px
pages:
  - slug: home
    sections:
      - {component: hero, variant: modern}
      - {component: services, variant: cards}
      - {component: cta, variant: banner}
  - slug: about
    sections:
      - {component: about, variant: standard}
  - slug: services
    sections:
      - {component: services, variant: grid}
  - slug: faq
    sections:
      - {component: faq, variant: standard}
  - slug: contact
    sections:
      - {component: contact, variant: split}
