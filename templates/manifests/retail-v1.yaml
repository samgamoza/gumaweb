slug: retail-v1
name: Retail - Modern
category: retail
version: 1
default: true
industries: [retail]
description: Simple, approachable layout for shops and stores.
theme:
  palette:
    primary: "#15803d"
    primary_contrast: "#ffffff"
    accent: "#122117"
    background: "#ffffff"
    surface: "#f1f8f3"
    text: "#122117"
    muted: "#4b6252"
    border: "#dcebe0"
  fonts:
    heading: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
    body: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  radius: 10px
pages:
  - slug: home
    sections:
      - {component: hero, variant: modern}
      - {component: services, variant: cards}
      - {component: cta, variant: banner}
      - {component: contact, variant: split}
  - slug: about
    sections:
      - {component: about, variant: standard}
  - slug: services
    title: Products & Services
    sections:
      - {component: services, variant: grid}
  - slug: faq
    sections:
      - {component: faq, variant: standard}
  - slug: contact
    sections:
      - {component: contact, variant: split}
