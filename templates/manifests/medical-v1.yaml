slug: medical-v1
name: Medical - Clean
category: medical
version: 1
default: true
industries: [medical_clinic, dental]
description: Calm, accessible layout for clinics and dental practices.
theme:
  palette:
    primary: "#0f766e"
    primary_contrast: "#ffffff"
    accent: "#11302d"
    background: "#ffffff"
    surface: "#f1f8f7"
    text: "#132522"
    muted: "#4a625e"
    border: "#d9ebe8"
  fonts:
    heading: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
    body: 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
  radius: 16px
pages:
  - slug: home
    sections:
      - {component: hero, variant: modern}
      - {component: services, variant: cards}
      - {component: about, variant: standard}
      - {component: cta, variant: banner}
  - slug: about
    sections:
      - {component: about, variant: standard}
  - slug: services
    sections:
      - {component: services, variant: accordion}
  - slug: faq
    sections:
      - {component: faq, variant: standard}
      - {component: cta, variant: banner}
  - slug: contact
    title: Appointments
    sections:
      - {component: contact, variant: split}
