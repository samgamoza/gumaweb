# Template for the production Secret referenced by secrets.existingSecret.
# Do NOT commit real values. Prefer External Secrets Operator / Sealed Secrets / Vault.
#   kubectl -n guma-core apply -f gumaweb-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: gumaweb-secrets
  namespace: guma-core
type: Opaque
stringData:
  JWT_SECRET_KEY: "<64+ random characters: openssl rand -base64 48>"
  DATABASE_URL: "postgresql+psycopg://gumaweb:<password>@gumaweb-pg-rw.guma-core.svc:5432/gumaweb"
  POSTGRES_PASSWORD: "<password>"
  S3_ACCESS_KEY: "<minio access key>"
  S3_SECRET_KEY: "<minio secret key>"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  VOICE_GATEWAY_TOKEN: ""
  FIRST_ADMIN_EMAIL: "admin@gumaweb.io"
  FIRST_ADMIN_PASSWORD: "<temporary password, rotate after first login>"
