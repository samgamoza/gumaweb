# Copied from infrastructure/nginx/sites.prod.conf - keep in sync.
# Production static host: <subdomain>.gumaweb.io -> /srv/sites/<subdomain>/
# TLS terminates at the ingress (wildcard certificate via cert-manager, DNS-01).
map $host $site {
    "~^(?<sub>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.gumaweb\.io$" $sub;  # quoted: {} needs it
    default "";
}

server {
    listen 8080;
    server_name ~^.+\.gumaweb\.io$;
    root /srv/sites/$site;

    if ($site = "") { return 404; }

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\. { return 404; }
    location = /healthz { access_log off; return 200 "ok"; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# Custom domains (Phase 5): <domain> and www.<domain> -> /srv/sites/_d/<domain>/ (published for verified
# domains only). Must stay after the *.gumaweb.io server: regex server names match in order.
# TLS for these hosts terminates at Caddy (on-demand certificates), see infrastructure/caddy/Caddyfile.
server {
    listen 8080;
    server_name "~^(?:www\.)?(?<cdomain>(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9-]{2,63})$";
    root /srv/sites/_d/$cdomain;

    gzip on;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
