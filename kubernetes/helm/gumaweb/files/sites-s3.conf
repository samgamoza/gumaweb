# Production static host backed by S3-compatible object storage (config.storageBackend=s3).
# <subdomain>.gumaweb.io/<path> -> MinIO bucket/<subdomain>/<path>; directory URLs map to index.html.
map $host $site {
    ~^(?<sub>[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)\.gumaweb\.io$ $sub;
    default "";
}

upstream objectstore {
    server MINIO_HOST:9000;
    keepalive 32;
}

proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=sites:50m max_size=2g inactive=30m use_temp_path=off;

server {
    listen 8080;
    server_name ~^.+\.gumaweb\.io$;

    if ($site = "") { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { access_log off; return 200 "ok"; }
    location ~ /\. { return 404; }

    location / {
        set $object $uri;
        if ($object ~ "/$") { set $object "${object}index.html"; }
        if ($object !~ "\.[a-z0-9]+$") { return 301 $uri/; }
        proxy_pass http://objectstore/BUCKET/$site$object;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host MINIO_HOST:9000;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_intercept_errors on;
        error_page 403 404 = @missing;
        proxy_cache sites;
        proxy_cache_valid 200 5m;
        add_header X-Cache $upstream_cache_status;
    }

    location @missing { return 404; }
}
