{{- if .Values.ai.enabled }}
# Local-first LLM inference (17-ai-infrastructure): vLLM serving an OpenAI-compatible API.
# Consumed by the backend when config.aiEnabled=true (LLM_BASE_URL).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-models
  namespace: {{ .Values.ai.namespace }}
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.ai.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.ai.storage.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: {{ .Values.ai.namespace }}
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/component: ai, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: ai, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: vllm
          image: {{ .Values.ai.image }}
          args: ["--model", {{ .Values.ai.model | quote }}, "--port", "8000", "--max-model-len", "16384"]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: HF_HOME, value: /models }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 120
            periodSeconds: 15
          resources:
            limits: { nvidia.com/gpu: {{ .Values.ai.gpus }} }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: vllm-models }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: {{ .Values.ai.namespace }}
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/component: ai, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- end }}
