{{- $name := include "gumaweb.fullname" . -}}
{{- define "gumaweb.jobPod" -}}
{{- include "gumaweb.podSecurity" .root | nindent 0 }}
restartPolicy: Never
{{- with .root.Values.global.imagePullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
containers:
  - name: {{ .container }}
    image: {{ include "gumaweb.image" (dict "root" .root "name" .root.Values.api.image) }}
    command: ["sh", "-c", {{ .command | quote }}]
    {{- include "gumaweb.apiEnv" .root | nindent 4 }}
    {{- include "gumaweb.containerSecurity" .root | nindent 4 }}
    volumeMounts:
      - { name: sites, mountPath: /srv/generated-sites }
      - { name: tmp, mountPath: /tmp }
volumes:
  {{- include "gumaweb.sitesVolume" .root | nindent 2 }}
  - name: tmp
    emptyDir: {}
{{- end -}}
{{- if .Values.jobs.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate-{{ .Release.Revision }}
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # post-install so the bundled Postgres exists on first install; pre-upgrade on later releases.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    spec:
      {{- include "gumaweb.jobPod" (dict "root" . "container" "migrate" "command" "alembic upgrade head && python -m app.cli seed") | nindent 6 }}
{{- end }}
{{- if .Values.jobs.outreachDispatch.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-outreach-dispatch
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: outreach
spec:
  schedule: {{ .Values.jobs.outreachDispatch.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          {{- include "gumaweb.jobPod" (dict "root" . "container" "dispatch" "command" "python -m app.cli dispatch-outreach") | nindent 10 }}
{{- end }}
{{- if .Values.jobs.factoryBatch.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-factory-batch
  labels: {{- include "gumaweb.labels" . | nindent 4 }}
    app.kubernetes.io/component: builder
spec:
  schedule: {{ .Values.jobs.factoryBatch.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          {{- include "gumaweb.jobPod" (dict "root" . "container" "factory" "command" (printf "python -m app.cli enqueue --limit %d" (int .Values.jobs.factoryBatch.limit))) | nindent 10 }}
{{- end }}
